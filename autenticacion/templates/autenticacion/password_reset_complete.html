{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    body {
        background: #e0edfe;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .reset-container {
        max-width: 480px;
        width: 100%;
        padding: 1rem;
    }
    
    .reset-card {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        padding: 3rem 2.5rem;
    }
    
    .success-icon {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .success-icon i {
        font-size: 4rem;
        color: #10B981;
    }
    
    .success-content {
        text-align: center;
    }
    
    .success-content h2 {
        color: #1F2937;
        font-weight: 700;
        font-size: 1.75rem;
        margin-bottom: 1rem;
    }
    
    .success-content p {
        color: #6B7280;
        font-size: 1rem;
        margin-bottom: 2rem;
    }
    
    .btn-login {
        width: 100%;
        padding: 0.875rem;
        background-color: #2563EB;
        border: none;
        border-radius: 0.5rem;
        color: white;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s;
    }
    
    .btn-login:hover {
        background-color: #1D4ED8;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <div class="reset-card">
        <div class="success-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        
        <div class="success-content">
            <h2>¡Contraseña Restablecida!</h2>
            <p>
                Tu contraseña ha sido restablecida exitosamente. 
                Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            
            <a href="{% url 'autenticacion:login' %}" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Iniciar Sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
